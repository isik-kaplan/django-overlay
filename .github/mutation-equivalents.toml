# Mutants that no test can kill, because the mutated code behaves identically
# to the original. Each one is subtracted from the survivor list in phase two.
#
# This is an escape hatch from a policy, so it is guarded like one:
#
#   * every entry needs a `reason`, and it has to be an actual explanation --
#     the file is rejected if one is missing or too short to be one.
#   * an entry whose mutant no longer exists fails the build, so a rewrite that
#     makes an exemption obsolete forces it to be revisited rather than
#     leaving a permanent hole where the code used to be.
#   * an entry whose mutant is now killed fails too. An unnecessary exemption
#     is how a list like this quietly grows into a way of ignoring the policy.
#
# Prefer `# pragma: no mutate` on the line, which needs no bookkeeping. This
# file is for the cases where mutmut cannot see the pragma -- it reads them
# only from standalone comment lines attached to a statement, so a mutation
# belonging to a keyword argument inside a multi-line call is out of its reach.

