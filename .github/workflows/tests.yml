name: Tests

# Tests run on everything: every pull request whatever it targets, and every
# push to master. The `pull_request` trigger is deliberately unfiltered rather
# than paired with a `push` trigger on all branches — a branch that is pushed
# and then opened as a PR would otherwise run the whole matrix twice.
on:
  push:
    branches:
      - master
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Everything here is cheap enough to run for anybody. The two expensive
  # policies — mutation testing and the scale 0.3 benchmark — live in their own
  # workflows, each with its own maintainer gate and its own concurrency rules,
  # because a four-hour job and a five-minute matrix want opposite answers to
  # "should a new push cancel this?".
  # Nothing linted on CI until now, and two separate things hid that.
  #
  # `fix = true` in pyproject.toml means a bare `ruff check` edits the files and
  # then reports only what it could not fix, so running it locally shows a tree
  # quietly corrected and a clean-looking exit. And .pre-commit-config.yaml has
  # been in the repository since the first commit, but installing it writes to
  # .git/hooks/, which is not tracked -- so it was configured, committed, and
  # inert in every checkout that never ran `pre-commit install`.
  #
  # This runs the same hooks the config already declared, so CI and a developer
  # with the hook installed cannot disagree. --all-files because CI has no
  # staged set to work from, and --show-diff-on-failure so a red run shows the
  # edit the hook wanted rather than only naming the rule.
  #
  # It is its own job rather than a step in `test`: no database, no matrix,
  # seconds to run, and a lint failure should not be reported as which Python
  # version broke.
  lint:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v3

      - name: Install uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: uv sync

      # Each hook builds its own isolated environment on first use, which is
      # most of this job's runtime. Keyed on the config, so a version bump in
      # it rebuilds and nothing else does.
      - name: Cache pre-commit environments
        uses: actions/cache@v4
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ hashFiles('.pre-commit-config.yaml') }}

      - name: Pre-commit
        run: uv run pre-commit run --all-files --show-diff-on-failure

  test:
    strategy:
      fail-fast: false
      matrix:
        # 3.11 is gone with the Django 6.0 floor — 6.0 requires 3.12, so a
        # 3.11 job could only ever resolve a Django this package does not work
        # against. See requires-python in pyproject.toml.
        python-version: ['3.12', '3.13', '3.14']
        os-version: [ubuntu-22.04]

    runs-on: ${{ matrix.os-version }}

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: django_overlay_test
        ports:
          - 5432:5432
        # 64MB of /dev/shm is not enough for Postgres parallel workers --
        # see the note in benchmarks.yml.
        options: >-
          --shm-size=1g
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      POSTGRES_HOST: localhost
      POSTGRES_PORT: 5432
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: django_overlay_test
      POSTGRES_TENANTS_DB: django_overlay_tenants_test

    steps:
      - uses: actions/checkout@v3

      - name: Install uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          uv sync

      - name: Run tests with coverage
        run: |
          uv run pytest --cov=django_overlay --cov-report=term-missing

      - name: Run multi-tenant tests
        env:
          DJANGO_SETTINGS_MODULE: tests.django_tenants_settings
        run: |
          uv run pytest tests/test_tenants -o addopts="" --create-db

      # Probes are named probe_*.py, so pytest's default python_files pattern
      # never collects them in the run above. That is deliberate -- they are
      # reports, and a couple are slow or measure timings -- but it also meant
      # nothing ran them, and two of them rotted unnoticed against changes to
      # the code they measure. Named explicitly here so they at least have to
      # execute; the ones that can pin an expected outcome now assert it.
      - name: Run probes
        run: |
          uv run pytest \
            tests/probe_orm_conformance.py \
            tests/probe_soft_delete_compat.py \
            tests/probe_constraint_kinds.py \
            tests/probe_declaration_shapes.py \
            tests/probe_unique_after_soft_delete.py \
            tests/probe_f_routes.py \
            tests/probe_write_cost.py \
            -o addopts="" -q -s

      # Separate because it races threads against a lossy path on purpose --
      # its numbers are statistical, so it reports rather than gates.
      - name: Run the lost-update measurement (report only)
        continue-on-error: true
        run: |
          uv run pytest tests/probe_lost_updates.py -o addopts="" -q -s
