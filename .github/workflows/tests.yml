name: Tests

# Tests run on everything: every pull request whatever it targets, and every
# push to master. The `pull_request` trigger is deliberately unfiltered rather
# than paired with a `push` trigger on all branches — a branch that is pushed
# and then opened as a PR would otherwise run the whole matrix twice.
on:
  push:
    branches:
      - master
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Is this run one we trust to be worth hours of compute? Mutation testing is
  # up to two hours, and running it for anybody who opens a pull request is
  # both an easy way to burn the account's minutes and a way to train everyone
  # to ignore a red check that was never going to finish.
  #
  # `author_association` is GitHub's own answer to "does this person have
  # standing in this repository". Anything that is not a pull request — a push
  # to master, a manual dispatch — is by definition already gated on write
  # access, so it passes.
  #
  # The same block exists in benchmarks.yml. Two copies of ten lines beat a
  # reusable workflow for something this small, but they must move together.
  gate:
    runs-on: ubuntu-22.04
    outputs:
      maintainer: ${{ steps.check.outputs.maintainer }}
    steps:
      - id: check
        env:
          EVENT: ${{ github.event_name }}
          ASSOCIATION: ${{ github.event.pull_request.author_association }}
        run: |
          if [ "$EVENT" != "pull_request" ]; then
            echo "maintainer=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          case "$ASSOCIATION" in
            OWNER|MEMBER|COLLABORATOR)
              echo "maintainer=true" >> "$GITHUB_OUTPUT" ;;
            *)
              echo "maintainer=false" >> "$GITHUB_OUTPUT"
              echo "::notice::Mutation testing is skipped for outside contributions; it runs on master after merge." ;;
          esac

  test:
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13', '3.14']
        os-version: [ubuntu-22.04]

    runs-on: ${{ matrix.os-version }}

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: django_overlay_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      POSTGRES_HOST: localhost
      POSTGRES_PORT: 5432
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: django_overlay_test
      POSTGRES_TENANTS_DB: django_overlay_tenants_test

    steps:
      - uses: actions/checkout@v3

      - name: Install uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          uv sync

      - name: Run tests with coverage
        run: |
          uv run pytest --cov=django_overlay --cov-report=term-missing

      - name: Run multi-tenant tests
        env:
          DJANGO_SETTINGS_MODULE: tests.django_tenants_settings
        run: |
          uv run pytest tests/test_tenants -o addopts="" --create-db

      # Probes are named probe_*.py, so pytest's default python_files pattern
      # never collects them in the run above. That is deliberate -- they are
      # reports, and a couple are slow or measure timings -- but it also meant
      # nothing ran them, and two of them rotted unnoticed against changes to
      # the code they measure. Named explicitly here so they at least have to
      # execute; the ones that can pin an expected outcome now assert it.
      - name: Run probes
        run: |
          uv run pytest \
            tests/probe_orm_conformance.py \
            tests/probe_soft_delete_compat.py \
            tests/probe_constraint_kinds.py \
            tests/probe_declaration_shapes.py \
            tests/probe_unique_after_soft_delete.py \
            tests/probe_f_routes.py \
            tests/probe_write_cost.py \
            -o addopts="" -q -s

      # Separate because it races threads against a lossy path on purpose --
      # its numbers are statistical, so it reports rather than gates.
      - name: Run the lost-update measurement (report only)
        continue-on-error: true
        run: |
          uv run pytest tests/probe_lost_updates.py -o addopts="" -q -s

  mutation:
    # Policy: no mutant survives. A mutant that lives is a change to
    # django_overlay/ that no test objects to — either the test is missing or
    # the code is dead. A genuinely equivalent mutant gets a
    # `# pragma: no mutate` on its line explaining why, not a tolerance here.
    #
    # Single Python version on purpose: mutation results don't vary across
    # interpreters, and this job runs the whole suite once per mutant.
    #
    # Maintainer runs only — see the `gate` job. On an outside contributor's
    # pull request this is skipped and the policy is enforced on master after
    # merge instead. The trade is deliberate: a surviving mutant can reach
    # master and be caught one commit later, which is better than every
    # contributor waiting two hours for a check they cannot interpret.
    needs: gate
    if: needs.gate.outputs.maintainer == 'true'
    runs-on: ubuntu-22.04
    # A cold run is ~1100 mutants, each running the whole suite, which is
    # hours — the cache below is what makes this viable, since mutmut's git
    # change detection then re-checks only what actually moved. A cold cache
    # will hit this timeout; the fix is a per-child test
    # database so max_children can go above 1) and for why the gate does not
    # reach zero yet.
    timeout-minutes: 120

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: django_overlay_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      POSTGRES_HOST: localhost
      POSTGRES_PORT: 5432
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: django_overlay_test

    steps:
      - uses: actions/checkout@v3

      - name: Install uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          uv sync

      # mutants/ holds the per-file .meta result files. Restoring them lets
      # mutmut's git change detection skip mutants whose code didn't move.
      - name: Restore mutation cache
        uses: actions/cache@v4
        with:
          path: mutants
          key: mutmut-${{ hashFiles('uv.lock', 'pyproject.toml') }}-${{ github.sha }}
          restore-keys: |
            mutmut-${{ hashFiles('uv.lock', 'pyproject.toml') }}-

      # The regions mutmut structurally can't reach.
      # mutmut forks a pre-warmed parent and only picks the mutant in the
      # child, so anything that runs at import time (the metaclass, every
      # migration operation, the SQL templates) has already run against the
      # original code. This harness edits the source directly instead.
      #
      # Deliberately first: it is minutes rather than hours, it covers the DDL
      # layer that mutmut excludes entirely, and unlike the step below it is
      # currently at zero, so it is the half of the policy that actually gates.
      - name: Mutation-test the code mutmut can't reach
        run: |
          uv run python tests/probe_unreachable_mutants.py

      - name: Run mutation tests
        run: |
          uv run mutmut run

      - name: Enforce the no-surviving-mutant policy
        if: always()
        run: |
          uv run mutmut export-cicd-stats
          uv run python .github/scripts/check_mutants.py

      - name: Upload mutation results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: mutmut-results
          path: |
            mutants/mutmut-cicd-stats.json
          if-no-files-found: ignore
